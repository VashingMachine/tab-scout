<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tab Scout</title>
  <link rel="stylesheet" href="ui.css">
  <script type="module" src="search.mjs"></script>
</head>
<body data-surface="popup">
  <main class="scout">
    <header class="toolbar">
      <h1><img src="icons/app-32.png" alt="" width="28" height="28">Tab Scout</h1>
      <div class="toolbar-actions">
        <span id="private-badge" class="private-badge" hidden>Private</span>
        <button id="refresh" class="icon-button" type="button" title="Refresh tabs" aria-label="Refresh tabs"><img src="icons/refresh-cw.svg" alt=""></button>
        <button id="settings" class="icon-button" type="button" title="Settings" aria-label="Settings"><img src="icons/settings.svg" alt=""></button>
      </div>
    </header>
    <form id="search-form" class="search-form" role="search">
      <div class="search-field">
        <img class="search-icon" src="icons/search.svg" alt="">
        <input id="query" name="q" type="search" placeholder="Search tabs or the web" aria-label="Search tabs or the web" role="combobox" aria-autocomplete="list" aria-controls="results" aria-expanded="true" autocomplete="off" autocapitalize="off" spellcheck="false">
        <button id="clear-search" class="icon-button" type="button" title="Clear search" aria-label="Clear search" hidden><img src="icons/x.svg" alt=""></button>
      </div>
    </form>
    <section class="result-region" aria-label="Search results">
      <div id="status" class="status" role="status" aria-live="polite">Loading tabs...</div>
      <div id="results" class="results" role="listbox" aria-label="Search results"></div>
    </section>
    <footer class="result-footer"><span id="summary" aria-live="polite"></span><span id="provider-status"></span></footer>
  </main>
</body>
</html>
